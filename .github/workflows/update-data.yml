name: 週次データ自動更新

on:
  schedule:
    # 毎週月曜 06:00 JST = 日曜 21:00 UTC
    # 年次・月次・日次の3バッチを連続実行し、最新値で再生成する
    - cron: '0 21 * * 0'
  workflow_dispatch:
    # 手動実行ボタン

jobs:
  refresh-data:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: チェックアウト
        uses: actions/checkout@v4

      - name: pnpm セットアップ
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Node.js セットアップ
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'

      - name: 依存関係インストール
        run: pnpm install --frozen-lockfile

      - name: 年次データ取得（e-Stat / FRED FX・Nikkei 実値 / MOF）
        env:
          ESTAT_API_KEY: ${{ secrets.ESTAT_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: pnpm data:fetch

      - name: 月次データ取得（CPI / FX / Nikkei 直近24か月）
        env:
          ESTAT_API_KEY: ${{ secrets.ESTAT_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: pnpm data:fetch:monthly

      - name: 日次データ取得（FX / Nikkei 直近90日）
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: pnpm data:fetch:daily

      - name: 整合性スナップショットの追従更新
        # データ更新で consistency.test.ts のインライン snapshot が陳腐化することが
        # あるので、同じコミットで -u して取り込む。データ変更とテスト更新を
        # 1 トランザクションにまとめる狙い。
        run: pnpm --filter web exec vitest run lib/consistency.test.ts -u
        continue-on-error: true

      - name: 差分確認
        run: |
          git diff --stat \
            apps/web/lib/data.generated.json \
            apps/web/lib/data.monthly.generated.json \
            apps/web/lib/data.daily.generated.json \
            apps/web/lib/consistency.test.ts || true

      - name: テスト再実行（更新後の整合確認）
        run: pnpm --filter web test

      - name: 変更を PR として作成
        # master は branch protection で verify check 必須のため直 push できない。
        # 自動更新ブランチに push して PR を起こし、CI 通過後ユーザーがマージする。
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add \
            apps/web/lib/data.generated.json \
            apps/web/lib/data.monthly.generated.json \
            apps/web/lib/data.daily.generated.json \
            apps/web/lib/consistency.test.ts
          if git diff --staged --quiet; then
            echo "データに変更なし。スキップします。"
            exit 0
          fi
          DATE=$(date +'%Y-%m-%d')
          BRANCH="chore/auto-data-refresh-${DATE}"
          # 同日内の再実行で既存ブランチがあれば再利用（force push で上書き）
          git checkout -b "${BRANCH}"
          git commit -m "chore: 週次データ自動更新 ${DATE}"
          git push -u --force origin "${BRANCH}"
          # 同日内の PR が既に存在すればスキップ（force push で更新済）
          if gh pr view "${BRANCH}" --json state --jq '.state' 2>/dev/null | grep -q OPEN; then
            echo "既存 PR を更新しました（force push）"
          else
            gh pr create \
              --title "chore: 週次データ自動更新 ${DATE}" \
              --body "GitHub Actions の週次バッチで生成されたデータ更新です。

## 更新対象
- \`apps/web/lib/data.generated.json\`（年次）
- \`apps/web/lib/data.monthly.generated.json\`（月次・直近24か月）
- \`apps/web/lib/data.daily.generated.json\`（日次・直近90日）
- \`apps/web/lib/consistency.test.ts\`（snapshot 追従、必要時のみ）

CI（\`verify\` / \`audit\`）が通れば squash merge してください。" \
              --base master \
              --head "${BRANCH}"
          fi
